name: Шаблон
description: описание шаблона
title: "[Ошибка]: "
labels: ["bug"]


body:
  - type: input
    id: Header
    attributes:
      label: Header
      description: "Заголовок"
      placeholder: "Заголовок"
    validations:
      required: true

  - type: textarea
    id: Discription
    attributes:
      label: Discription
      description: "Описание"
      placeholder: "Описание"
    validations:
      required: true

  - type: textarea
    id: Steps
    attributes:
      label: Steps
      description: "Шаги воспроизведения "
      placeholder: "Шаги воспроизведения"
    validations:
      required: true

  - type: textarea
    id: ExpectedResults
    attributes:
      label: ExpectedResults
      description: "Ожидаемый результат"
      placeholder: "Ожидаемый результат"
    validations:
      required: true

  - type: textarea
    id: ActualResults
    attributes:
      label: ActualResults
      description: "Фактический  результат"
      placeholder: "Фактический  результат"
    validations:
      required: true

  - type: textarea
    id: Screenshot
    attributes:
      label: Screenshot
      description: "Скриншоты / Доп. материалы"
      placeholder: "Скриншоты / Доп. материалы"
    validations:
      required: true

  - type: dropdown
    id: Priority
    attributes:
      label: "Приоритет"
      description: "Приоритет"
      options:
       - фигня
       - Важно
       - Очень важно
       - Супер важно
    validations:
      required: true

  
